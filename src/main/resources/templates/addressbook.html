<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>sysc4806Lab AddressBook</title></head>
<body>
<main>
    <section th:if="${addressBook != null}">
        <h1 th:text="|Address Book ${addressBook.id}|">Address Book</h1>
        <p th:if="${#lists.isEmpty(addressBook.buddies)}">This address book has no buddies yet.</p>
        <table th:unless="${#lists.isEmpty(addressBook.buddies)}">
            <thead><tr><th>ID</th><th>Name</th><th>Phone number</th><th>Address</th></tr></thead>
            <tbody><tr th:each="buddy : ${addressBook.buddies}">
                <td th:text="${buddy.id}"></td>
                <td th:text="${buddy.name}"></td>
                <td th:text="${buddy.phoneNumber}"></td>
                <td th:text="${buddy.address}"></td>
            </tr></tbody>
        </table>
        <form th:action="@{/addressbooks/{id}/buddies(id=${addressBook.id})}" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <label for="phoneNumber">Phone number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber">
            <label for="address">Address</label>
            <input type="text" id="address" name="address">
            <button type="submit">Add buddy</button>
        </form>
    </section>
    <section th:if="${missingId != null}">
        <h1>Address book not found</h1>
        <p th:text="|No address book exists with ID ${missingId}.|"></p>
    </section>
</main>
</body>
</html>
